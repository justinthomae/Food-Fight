# Food Fight iPhone and Android apps (app/). Runs only when started by hand:
# Actions > Food Fight apps > Run workflow. Builds the website into the Capacitor shell, then:
#   Android: an App Bundle (.aab), signed and sent to Play internal testing once the Android secrets are set.
#   iPhone:  a compile check, or a signed build uploaded to TestFlight once the App Store Connect secrets are set.
# Without any secrets both jobs still prove the apps build. Setup steps: docs/STORE_RELEASE.md.
name: Food Fight apps

on:
  workflow_dispatch:
    inputs:
      android:
        description: "Build the Android app"
        type: boolean
        default: true
      ios:
        description: "Build the iPhone app"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: foodfight-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      HAS_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install --no-audit --no-fund
      - name: Native project, web files, icons and splash
        run: |
          npm run build:www
          npx cap add android
          npm run cap:assets -- --android
          npx cap sync android
      - name: Version and build number
        run: |
          VERSION=$(node -p "require('./package.json').version")
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" $G
          # portrait only, like the website
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - name: Signing (from secrets)
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat >> android/app/build.gradle <<GRADLE
          android {
            signingConfigs { upload { storeFile file("$RUNNER_TEMP/upload.jks"); storePassword System.getenv("KS_PASS"); keyAlias System.getenv("KEY_ALIAS"); keyPassword System.getenv("KEY_PASS") } }
            buildTypes { release { signingConfig signingConfigs.upload } }
          }
          GRADLE
      - name: Build the App Bundle
        working-directory: app/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: foodfight-android
          path: app/android/app/build/outputs/bundle/release/*.aab
      - name: Upload to Google Play (internal testing)
        if: env.HAS_KEY == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.grudgematchgames.foodfight
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios:
    if: inputs.ios
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_P8_BASE64 != '' || secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Native project, web files, icons and splash
        run: |
          npm run build:www
          npx cap add ios
          npm run cap:assets -- --ios
          npx cap sync ios
      - name: Portrait only, no encryption questions
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $P
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $P || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || true
      - name: Compile check (no signing keys yet)
        if: env.HAS_ASC != 'true'
        working-directory: app/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Archive, sign and upload to TestFlight
        if: env.HAS_ASC == 'true'
        working-directory: app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_TEXT: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > "$KEY"; else printf '%s\n' "$KEY_TEXT" > "$KEY"; fi
          set -o pipefail
          VERSION=$(node -p "require('../../package.json').version")
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          # Same route as Broadside: archive unsigned, then the export signs for the App Store with Apple's
          # cloud-managed certificate and uploads to TestFlight.
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FoodFight.xcarchive" DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=$VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} archive | tail -20
          APP="$RUNNER_TEMP/FoodFight.xcarchive/Products/Applications/App.app"
          for f in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do
            [ -e "$f" ] && codesign --force --sign - --timestamp=none "$f"
          done
          codesign --force --sign - --timestamp=none "$APP"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FoodFight.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH 2>&1 | tail -40
          echo "Uploaded build ${{ github.run_number }} of $VERSION to App Store Connect (TestFlight lists it once Apple has processed it)."
